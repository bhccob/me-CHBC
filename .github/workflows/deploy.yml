# Builds, tests and audits the site, then deploys it to GitHub Pages.
# Requires: repository Settings → Pages → Source = "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the build (which also runs on pull requests) only reads; only the deploy job may publish.
# Each action is pinned to a commit, with its version beside it; Dependabot keeps both up to date.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not left in .git/config, where the build's own scripts could read it.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # SECURITY.md section 1: no secret may be committed. Fails on the usual key shapes anywhere in the tracked files.
      - name: Scan for committed secrets
        run: |
          if git grep -nIE 'sk-ant-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,}|xox[abprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}' -- . ':!package-lock.json'; then
            echo "::error::A secret-shaped value is committed (see above). Rotate it first, then remove it from the history."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Test the site auditor
        run: python -m unittest discover tools -v

      - name: Audit the built site
        run: python tools/site_audit.py dist/client --strict

      # Accessibility, SEO and best practices must hold; performance is reported as a warning
      # (CI machines vary too much for a hard limit). Thresholds live in lighthouserc.json.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist/client
          # Keeps public/.well-known/security.txt in the deployed site.
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
