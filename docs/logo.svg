<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -2 14 14" width="256" height="256" role="img" aria-label="bhccob">
  <!-- Bob's logo (public/icon.svg), unchanged, shown at the top of the README. The two strokes draw themselves, hold, and start again. -->
  <style>
    path { stroke-dasharray: 1; animation: draw 9s cubic-bezier(.4, 0, .2, 1) infinite both; }
    .gold { animation-delay: .5s; }
    @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 1; } 22%, 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { path { animation: none; } }
  </style>
  <rect x="-4" y="-2" width="14" height="14" rx="3.1" fill="#0c0519"/>
  <g fill="none" stroke-width="0.34" stroke-linecap="butt" stroke-linejoin="miter">
    <path pathLength="1" d="M0.5 0.05V5.5H2.2M2.8 5.5H3.5V2.5H0.5" stroke="#efe8d6"/>
    <path class="gold" pathLength="1" d="M5.5 9.95V4.5H3.8M3.2 4.5H2.5V7.5H5.5" stroke="#f2cf7a"/>
  </g>
</svg>
