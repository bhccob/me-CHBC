<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coin · 07 The push</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="mock.css" />
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/", "postprocessing": "/node_modules/postprocessing/build/index.js" } }</script>
</head>
<body class="dark">
<canvas class="full" aria-hidden="true"></canvas>
<script type="module">
import { THREE, C, robotHand, visorHead, fonts, canvasTex, pixelCamera, ready } from './kit.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

await fonts();
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('canvas'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#07050b');
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera();
pixelCamera(camera, W, H);

// The page, now a sheet in 3D (the HTML was swapped for its picture), being pushed down. Its top edge is at 58 %.
const top = H * 0.47;
const holeX = W / 2, holeY = top - H * 0.5; // the round hole, sliding down with the page
const pageTex = canvasTex(W, H, (x, w, h) => {
  x.fillStyle = C.page; x.fillRect(0, 0, w, h);
  x.fillStyle = C.ink; x.font = '500 15px Barlow';
  x.fillText('Bob Chung', 38, 52);
  x.font = '500 11px "IBM Plex Mono"';
  x.fillText('T W O   S I D E S ,   O N E   C O I N', w / 2 - 120, h * 0.86);
  x.globalCompositeOperation = 'destination-out';
  x.beginPath(); x.arc(w / 2, h * 0.5, h * 0.27, 0, Math.PI * 2); x.fill();
});
const geo = new THREE.PlaneGeometry(W, H, 160, 90);
const pos = geo.attributes.position;
const hands = [W * 0.3, W * 0.7];
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i) + W / 2, y = pos.getY(i) + H / 2;
  const nearTop = Math.max(0, 1 - (H - y) / (H * 0.22));
  let dip = 0;
  for (const hx of hands) dip += Math.exp(-((x - hx) ** 2) / (2 * (W * 0.07) ** 2));
  pos.setZ(i, -dip * nearTop * nearTop * H * 0.07 - Math.sin((x / W) * Math.PI) * nearTop * H * 0.01);
}
geo.computeVertexNormals();
const page = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: pageTex, roughness: 0.9, metalness: 0, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide }));
page.position.set(W / 2, top - H / 2, 0);
page.receiveShadow = page.castShadow = true;
scene.add(page);

// Behind it, the visor is already lit: its glow shows over the page's edge before the page is gone.
const head = visorHead([['INSERT COIN']]);
head.scale.setScalar(H * 0.12);
head.position.set(W / 2, H * 0.6, -H * 0.8);
scene.add(head);

// Two hands, backs to the visitor, fingers hooked over the top edge, pushing the sheet down.
// Big enough that each wrist leaves the frame at the bottom edge: only hands, cut at the wrist by the frame.
const k = H * 0.37;
for (const [i, hx] of hands.entries()) {
  const hand = robotHand({ curl: [[0.35, 1.45, 1.0], [0.35, 1.5, 1.05], [0.35, 1.5, 1.05], [0.35, 1.4, 0.95]], spread: 0.05, thumb: [0.45, 0.25], left: i === 0, glow: 1.2 });
  hand.scale.setScalar(k);
  hand.position.set(hx, top - k * 1.3, k * 0.5);
  hand.rotation.set(-0.32, Math.PI, i === 0 ? 0.14 : -0.14);
  scene.add(hand);
}
const key = new THREE.DirectionalLight('#fff1dc', 2.4);
key.position.set(W * 0.2, H * 1.4, H * 1.6);
key.target.position.set(W / 2, H / 2, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 8;
Object.assign(key.shadow.camera, { left: -W, right: W, top: H, bottom: -H, near: 1, far: H * 6 });
scene.add(key, key.target, new THREE.HemisphereLight('#fff4e6', '#20152a', 0.5));
const visorLight = new THREE.PointLight(C.glow, 1.6, 0, 0);
visorLight.position.set(W / 2, H * 0.8, -H * 0.2);
scene.add(visorLight);
renderer.render(scene, camera);
ready();
</script>
</body>
</html>
