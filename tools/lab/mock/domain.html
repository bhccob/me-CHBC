<!doctype html>
<html lang="en">

<title>Selected works · The domain</title>

<style>
  html, body { overflow-x: hidden; overflow-y: auto; height: auto; }
  body { background: #06050a; color: var(--light); cursor: none; }
  .track { height: 900vh; }
  canvas.full { z-index: 1; }
  /* The page before the domain opens: off-white, the works coin in the middle; its square hole grows over everything. */
  .gate { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; --s: 15.4vmin; --r: 0deg; }
  .gate .hole { position: absolute; left: 50%; top: 50%; width: var(--s); height: var(--s); transform: translate(-50%, -50%); box-shadow: 0 0 0 300vmax var(--page); }
  .gate img { position: absolute; left: 50%; top: 50%; width: calc(var(--s) * 2.09); transform: translate(-50%, -50%) rotate(var(--r)); }
  .gate p { position: absolute; left: 50%; bottom: 14vh; transform: translateX(-50%); margin: 0; color: var(--ink-soft); }
  .label { position: fixed; left: 0; top: 0; z-index: 4; margin: 0; pointer-events: none; white-space: nowrap; transition: opacity 0.3s; }
  .label b { display: block; font: 500 16px Barlow; color: var(--light); }
  .label span { display: block; margin-top: 4px; color: rgb(242 239 232 / 0.5); }
  .label.locked b { color: var(--glow); }
  .cursor { position: fixed; left: 0; top: 0; z-index: 9; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; border: 1px solid rgb(242 239 232 / 0.55); display: grid; place-items: center; pointer-events: none;
    font: 500 10px 'IBM Plex Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--light); transition: width 0.35s, height 0.35s, margin 0.35s, background 0.35s, border-color 0.35s; }
  .cursor.open { width: 104px; height: 104px; margin: -52px 0 0 -52px; background: var(--light); color: var(--ink); border-color: var(--light); }
  .count { position: fixed; right: var(--gutter); bottom: var(--gutter); z-index: 5; margin: 0; color: rgb(242 239 232 / 0.6); }
  .count b { color: var(--light); font-weight: 500; }
  .hintx { position: fixed; left: 50%; bottom: var(--gutter); transform: translateX(-50%); z-index: 5; margin: 0; color: rgb(242 239 232 / 0.5); }
  .focus { position: fixed; left: var(--gutter); bottom: 7vh; z-index: 5; margin: 0; opacity: 0; transform: translateY(16px); transition: opacity 0.5s, transform 0.5s; pointer-events: none; }
  .focus.on { opacity: 1; transform: none; }
  .focus h2 { margin: 0; font-size: clamp(56px, 8vw, 120px); }
  .focus p { margin: 14px 0 0; max-width: 34ch; color: rgb(242 239 232 / 0.65); font-size: 17px; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/", "postprocessing": "/node_modules/postprocessing/build/index.js" } }</script>
</head>
<body class="dark">
<div class="track"></div>
<canvas class="full" aria-hidden="true"></canvas>
<div class="gate" aria-hidden="true"><div class="hole"></div><p class="mono">01 · Selected works</p></div>
<div id="labels"></div>
<div class="focus"><h2 class="display"></h2><p></p></div>
<p class="hintx mono">Drag or scroll</p>
<p class="count mono"><b>01</b> / 05</p>
<div class="cursor">Drag</div>
<div class="chrome"><p class="tl">Bob Chung</p><p class="tr"><span>Selected works</span><span>EN</span></p></div>
<script type="module">
import { THREE, C, coin, stage, fonts, canvasTex, loadTexture, lockedScreen, lockedGame, ready } from './kit.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

await fonts();
const W = innerWidth, H = innerHeight;
const q = new URLSearchParams(location.search);

// ------------------------------------------------------------------ the gate: the works coin, whose square hole opens
const gate = document.querySelector('.gate');
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 1024;
  const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.toneMapping = THREE.AgXToneMapping; r.toneMappingExposure = 1.2;
  const sc = new THREE.Scene();
  sc.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
  sc.environmentIntensity = 0.8;
  sc.add(coin(), new THREE.DirectionalLight('#fff3e2', 2));
  const cam = new THREE.OrthographicCamera(-1.02, 1.02, 1.02, -1.02, 0.1, 10); cam.position.z = 5;
  r.render(sc, cam);
  const im = document.createElement('img');
  im.alt = '';
  im.src = cv.toDataURL();
  gate.append(im);
  r.dispose();
}

// ------------------------------------------------------------------ the domain
const s = stage(document.querySelector('canvas'), { fov: 46, env: 0.2 }).post({ focus: 6.2, range: 5, bokeh: 0.35, bloom: 0.5, threshold: 0.92, vignette: 0.55, radius: 0.5 });
const { scene, camera } = s;
scene.background = new THREE.Color('#06050a');
scene.fog = new THREE.FogExp2('#06050a', 0.022);

// The domain: concentric squares on the floor and overhead (the coin's hole, rippling out from you), and a few far
// frames drifting in the dark. Ordered, not scattered.
const lattice = new THREE.Group();
const ripples = [];
{
  const square = (half, y, color, opacity) => new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints([[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => new THREE.Vector3(a * half, y, b * half))),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
  for (let i = 0; i < 22; i++) {
    const half = 3.4 * Math.pow(1.17, i);
    const strong = i % 4 === 1;
    const floor = square(half, -2.3, strong ? C.glow : '#b8aad8', (strong ? 0.55 : 0.16) * Math.pow(0.93, i));
    const roof = square(half * 1.1, 4.2, '#b8aad8', 0.08 * Math.pow(0.93, i));
    floor.userData.half = roof.userData.half = half;
    ripples.push(floor, roof);
    lattice.add(floor, roof);
  }
  const pts = [];
  let sd = 3; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 140; i++) {
    const dir = new THREE.Vector3(rnd() - 0.5, (rnd() - 0.35) * 0.9, rnd() - 0.5).normalize();
    const c = dir.clone().multiplyScalar(26 + rnd() * 44), size = 0.3 + rnd() * 0.9;
    const q4 = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.clone().negate());
    const k4 = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => new THREE.Vector3(a * size, b * size, 0).applyQuaternion(q4).add(c));
    for (let k = 0; k < 4; k++) { const a = k4[k], b = k4[(k + 1) % 4]; pts.push(a.x, a.y, a.z, b.x, b.y, b.z); }
  }
  lattice.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)), new THREE.LineBasicMaterial({ color: C.glow, transparent: true, opacity: 0.3 })));
}
scene.add(lattice);

// The five works, all the same size, on a ring round you. Ten panels, so the ring never ends.
const card = (draw) => canvasTex(1600, 1000, (x, w, h) => draw(x, w, h));
const cover = (img) => card((x, w, h) => { const s2 = Math.max(w / img.width, h / img.height); x.drawImage(img, (w - img.width * s2) / 2, (h - img.height * s2) / 2, img.width * s2, img.height * s2); });
const phone = (bg, imgOrCanvas) => card((x, w, h) => {
  const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, bg[0]); g.addColorStop(1, bg[1]); x.fillStyle = g; x.fillRect(0, 0, w, h);
  const ph = h * 0.86, pw = ph * (imgOrCanvas.width / imgOrCanvas.height);
  x.save(); x.beginPath(); x.roundRect((w - pw) / 2, (h - ph) / 2, pw, ph, 34); x.clip(); x.drawImage(imgOrCanvas, (w - pw) / 2, (h - ph) / 2, pw, ph); x.restore();
});
const img = (src) => new Promise((done) => { const i = new Image(); i.onload = () => done(i); i.src = src; });
const [lumoImg, jontaiImg, cookiesImg] = await Promise.all([img('img/lumo.webp'), img('/public/flight/jontai.webp'), img('/public/flight/cookies.webp')]);
const works = [
  { title: 'Lumo', meta: '01 · Android app · 2026', line: 'A grocery list that merges your recipes into one list, sorted by your store’s aisles.', tex: phone(['#1f7a34', '#0b3b17'], lumoImg) },
  { title: 'Locked', meta: '02 · Android app · 2026', line: 'A gym log that gives you your next weight from your own history.', tex: phone(['#2a1a12', '#0d0b0f'], lockedScreen().image) },
  { title: 'Jontai Energy', meta: '03 · Website · 2025', line: 'A clean-energy company’s site.', tex: cover(jontaiImg) },
  { title: 'Cookies Clicker', meta: '04 · Browser game · 2025', line: 'A browser game built with a classmate around one loop: click, earn, reinvest.', tex: cover(cookiesImg) },
  { title: 'Roblox game', meta: '05 · In development', line: 'Not named yet. Locked until it ships.', tex: card((x, w, h) => x.drawImage(lockedGame().image, 0, 0, w, h)), locked: true },
];
const PW = 3.2, PH = 2.0, RING = 6.2, N = 10;
const vert = `
  uniform float uBend; uniform float uLift;
  varying vec2 vUv;
  void main() {
    vUv = uv;
    vec3 p = position;
    p.z += uBend * (p.x * p.x) * 0.18 + uLift * 0.45;
    p.y += uBend * p.x * 0.05;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  }`;
const frag = `
  uniform sampler2D uMap; uniform float uHover; uniform float uDim; uniform float uLocked;
  varying vec2 vUv;
  void main() {
    vec2 uv = (vUv - 0.5) * (1.0 - uHover * 0.05) + 0.5;
    vec3 c = texture2D(uMap, uv).rgb;
    c = mix(c, vec3(dot(c, vec3(0.3, 0.59, 0.11))), uLocked * 0.6);
    c *= mix(0.86, 0.36, uDim) * (1.0 + uHover * 0.1);
    // A gold square draws round the panel you hover: the coin's hole again.
    vec2 e = min(vUv, 1.0 - vUv);
    float edge = step(min(e.x * 1.6, e.y), 0.006) * uHover;
    c = mix(c, vec3(1.7, 1.15, 0.4), edge);
    gl_FragColor = vec4(c, 1.0);
  }`;
const panels = [];
for (let i = 0; i < N; i++) {
  const w = works[i % works.length];
  const mat = new THREE.ShaderMaterial({ vertexShader: vert, fragmentShader: frag, uniforms: { uMap: { value: w.tex }, uBend: { value: 0 }, uLift: { value: 0 }, uHover: { value: 0 }, uDim: { value: 0 }, uLocked: { value: w.locked ? 1 : 0 } } });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH, 40, 20), mat);
  m.userData = { i, work: w, hover: 0 };
  panels.push(m);
  scene.add(m);
}
const labels = document.getElementById('labels');
for (const p of panels) {
  const el = document.createElement('p');
  el.className = `label${p.userData.work.locked ? ' locked' : ''}`;
  el.innerHTML = `<b>${p.userData.work.title}</b><span class="mono">${p.userData.work.meta}</span>`;
  labels.append(el);
  p.userData.label = el;
}

// ------------------------------------------------------------------ motion: scroll and drag turn the ring, with weight
const cursor = document.querySelector('.cursor');
const focusEl = document.querySelector('.focus');
const count = document.querySelector('.count b');
let target = 0, angle = 0, vel = 0, drag = null;
const mouse = new THREE.Vector2(0, 0), look = { x: 0, y: 0 };
let lastScroll = scrollY;
addEventListener('scroll', () => { const d = scrollY - lastScroll; lastScroll = scrollY; if (open() >= 1) target += d * 0.0016; });
addEventListener('pointermove', (e) => {
  cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
  mouse.set((e.clientX / W) * 2 - 1, -(e.clientY / H) * 2 + 1);
  if (drag) { target = drag.start - (e.clientX - drag.x) * 0.004; }
});
addEventListener('pointerdown', (e) => { drag = { x: e.clientX, start: target }; });
addEventListener('pointerup', () => { drag = null; });
const step = (Math.PI * 2) / N;
const embed = q.has('embed');
const ext = { open: 0, turn: 0 };
const open = () => (embed ? ext.open : q.has('open') ? 1 : Math.min(1, scrollY / (H * 1.1)));
if (embed) {
  // Embedded in pull.html: the first view is the gate; the parent opens the domain and turns the ring.
  gate.style.display = 'none';
  document.querySelector('.track').style.display = 'none';
  addEventListener('message', (e) => {
    if (!e.data || typeof e.data.open !== 'number') return;
    target += ((e.data.turn ?? 0) - ext.turn) * 1.4;
    ext.open = e.data.open;
    ext.turn = e.data.turn ?? 0;
  });
  addEventListener('wheel', (e) => parent.postMessage({ wheel: e.deltaY }, '*'), { passive: true });
}
const ease = (x) => x * x * (3 - 2 * x);
const ray = new THREE.Raycaster();
let last = performance.now(), hovered = null, shotReady = false;
if (q.has('open')) { target = Number(q.get('at') ?? 0.15); angle = target; }
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const k = open();
  // The gate: the hole grows from the coin's hole to past the screen's corners; the coin grows with it.
  const g = ease(Math.min(1, k * 1.15));
  const s0 = Math.min(W, H) * 0.16 * 0.96, s1 = Math.hypot(W, H) * 1.1;
  gate.style.setProperty('--s', `${s0 + (s1 - s0) * g * g}px`);
  gate.style.setProperty('--r', `${g * 18}deg`);
  gate.style.opacity = k >= 0.995 ? 0 : 1;
  // The ring, a beat late; its speed bends the panels.
  const prev = angle;
  angle += (target - angle) * (1 - Math.exp(-dt / 0.35));
  vel += ((angle - prev) / Math.max(dt, 1e-3) - vel) * 0.2;
  // The domain opening: the space spins down to stillness as you arrive.
  lattice.rotation.y = now * 0.00002 + (1 - k) * 1.2 + angle * 0.18;
  // The domain opening: the squares ripple out from you to where they rest.
  for (const r2 of ripples) r2.scale.setScalar(0.08 + 0.92 * ease(Math.min(1, k * 1.05)));
  look.x += (mouse.x * 0.12 - look.x) * 0.05; look.y += (mouse.y * 0.08 - look.y) * 0.05;
  camera.position.set(0, 0.15, 0);
  camera.lookAt(Math.sin(look.x) * 10, 0.15 + look.y * 10 - 0.4, -Math.cos(look.x) * 10);
  camera.fov = 46 + (1 - k) * 40;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  ray.setFromCamera(mouse, camera);
  const hit = k >= 1 && !drag ? ray.intersectObjects(panels)[0]?.object ?? null : null;
  if (hit !== hovered) { hovered = hit; cursor.classList.toggle('open', !!hit); cursor.textContent = hit ? (hit.userData.work.locked ? 'Soon' : 'Open') : 'Drag'; }
  let front = 0, best = -9;
  panels.forEach((p, i) => {
    const a = i * step - angle;
    p.position.set(Math.sin(a) * RING, 0, -Math.cos(a) * RING);
    p.lookAt(0, 0, 0);
    p.userData.hover += ((p === hovered ? 1 : 0) - p.userData.hover) * 0.12;
    const u = p.material.uniforms;
    u.uHover.value = p.userData.hover;
    u.uLift.value = p.userData.hover;
    u.uDim.value += ((hovered && p !== hovered ? 1 : 0) - u.uDim.value) * 0.1;
    u.uBend.value = THREE.MathUtils.clamp(-vel * 0.35, -0.6, 0.6);
    p.scale.setScalar(0.4 + 0.6 * ease(k));
    const facing = Math.cos(a);
    if (facing > best) { best = facing; front = i % works.length; }
    // Each title sits at the foot of its panel.
    const foot = new THREE.Vector3(-PW / 2, -PH / 2 - 0.12, 0).applyMatrix4(p.matrixWorld).project(camera);
    const el = p.userData.label;
    el.style.opacity = facing > 0.25 && foot.z < 1 && p !== hovered ? Math.min(1, (facing - 0.25) * 3) * k : 0;
    el.style.transform = `translate(${(foot.x * 0.5 + 0.5) * W}px, ${(-foot.y * 0.5 + 0.5) * H}px)`;
  });
  count.textContent = String(front + 1).padStart(2, '0');
  const fw = hovered?.userData.work;
  focusEl.classList.toggle('on', !!fw);
  if (fw) { focusEl.querySelector('h2').textContent = fw.title; focusEl.querySelector('p').textContent = fw.line; }
  s.render();
  if (!shotReady && now > 1500) { shotReady = true; ready(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
