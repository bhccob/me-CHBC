const frozen = new URLSearchParams(location.search).get('t');
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };

// ------------------------------------------------------------------ layout: the name, the O's slot, the introduction

  pc.setTransform(1, 0, 0, 1, 0, 0);
  pc.drawImage(paper, 0, 0);

  if (loading) return;
  rubOn(pm, e.clientX, e.clientY, 30, 0.22);
  if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; drawPaper(); }); }

// ------------------------------------------------------------------ the loader: a pencil rubs up the coin as the site loads
const loaderCanvas = document.querySelector('canvas.loader');
loaderCanvas.width = W * dpr; loaderCanvas.height = H * dpr;
const lc = loaderCanvas.getContext('2d');
const LR = Math.min(W, H) * 0.17, LX = W / 2, LY = H * 0.47;
const [loadRelief, lr] = layer();

const [loadMask, lm] = layer();
const zig = [];
const Z = 22;
for (let i = 0; i <= Z; i++) zig.push([LX - LR * 1.05 + (i / Z) * LR * 2.1 + Math.sin(i * 2.3) * LR * 0.06, LY + (i % 2 ? 1 : -1) * LR * (0.95 + Math.sin(i * 1.7) * 0.12)]);

function rubTo(p) {
  const goal = p * Z;
  while (rubbed < goal) {
    const i = Math.floor(rubbed), f = rubbed - i, step = Math.min(goal - rubbed, 0.02);

  lc.setTransform(1, 0, 0, 1, 0, 0);
  lc.clearRect(0, 0, loaderCanvas.width, loaderCanvas.height);
  lc.globalAlpha = alpha;
  lc.drawImage(paper, 0, 0);

let loading = true;

// ------------------------------------------------------------------ the 3D: the works coin, the cord, four plain coins below
const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('canvas.full'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;
const camera = new THREE.PerspectiveCamera();
pixelCamera(camera, W, H);
const X = ox, Y = H - oy;
const r = R * 0.3;
const ys = [0, 1, 2, 3].map((i) => Y - R - (H * (phone ? 0.06 : 0.078)) * (i + 1) - r * 0.6);

const small = ys.map(() => { const c = coin(); c.scale.setScalar(r); scene.add(c); return c; });
const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(6, 2.4, 64, 8, 2, 3), silk);

const sun = new THREE.DirectionalLight('#fff3e2', 2.4);
sun.position.set(X - W * 0.4, H * 1.4, H * 1.2);
sun.target.position.set(X, H / 2, 0);

sun.shadow.mapSize.set(2048, 2048);

// ------------------------------------------------------------------ the sequence
const letters = [...document.querySelectorAll('.name .l i')];
const lines = [...document.querySelectorAll('.intro .lead .line > span')];
const reveals = [...document.querySelectorAll('.reveal')];
const pointer = { x: 0 };
addEventListener('pointermove', (e) => { pointer.x = (e.clientX - X) / W; });
const t0 = performance.now();
let shot = false;

  knot.visible = tassel.visible = kk > 0;
  knot.position.set(X + sway(knotY, t), knotY, 0);
  tassel.position.set(X + sway(knotY, t), knotY - 6, 0);
  tassel.scale.y = kk;
  lines.forEach((el, i) => { el.style.transform = `translateY(${(1 - out((t - 3.7 - i * 0.12) / 0.8)) * 110}%)`; });
  reveals.forEach((el, i) => { el.style.opacity = ease((t - 4.2 - i * 0.06) / 0.5); });
  renderer.render(scene, camera);
  if (!shot && t > (frozen !== null ? -1 : 5.2)) { shot = true; ready(); }
  if (frozen === null) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
