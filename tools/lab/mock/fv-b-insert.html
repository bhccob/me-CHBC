<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First view B · Insert coin</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="mock.css" />
<style>
  body { background: #07050b; cursor: none; }
  /* A screen, not a page: a faint bezel, a glass sheen, scan lines you only notice up close. */
  .glass { position: fixed; inset: 12px; border-radius: 28px; border: 1px solid rgb(242 239 232 / 0.07); pointer-events: none; z-index: 1;
    background: linear-gradient(118deg, rgb(255 255 255 / 0.05), transparent 28%), radial-gradient(ellipse 60% 50% at 50% 46%, rgb(239 181 61 / 0.06), transparent 70%); }
  .glass::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: repeating-linear-gradient(0deg, rgb(0 0 0 / 0.18) 0 1px, transparent 1px 4px); opacity: 0.5; }
  .name { position: fixed; left: 0; right: 0; top: 38%; transform: translateY(-50%); margin: 0; text-align: center; font-size: 15.4vw; color: var(--light); z-index: 2; }
  .insert { position: fixed; left: 50%; top: 61%; transform: translateX(-50%); margin: 0; z-index: 2; color: var(--glow); font: 500 clamp(14px, 1.3vw, 20px) 'IBM Plex Mono', monospace; letter-spacing: 0.3em; }
  .insert i { display: inline-block; width: 0.6em; height: 1em; margin-left: 0.4em; background: var(--glow); vertical-align: -0.15em; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .credits { position: fixed; left: 50%; top: calc(61% + 44px); transform: translateX(-50%); margin: 0; z-index: 2; display: flex; gap: 10px; align-items: center; color: var(--light-soft); }
  .credits u { text-decoration: none; margin-right: 8px; }
  .credits b { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgb(239 181 61 / 0.6); }
  .slot { position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%); width: 64px; height: 84px; border-radius: 12px; z-index: 2;
    background: linear-gradient(#1e1b24, #121016); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.08), 0 10px 30px rgb(0 0 0 / 0.6); }
  .slot::after { content: ''; position: absolute; left: 50%; top: 14px; bottom: 14px; width: 8px; transform: translateX(-50%); border-radius: 4px; background: #000; box-shadow: 0 0 0 2px rgb(239 181 61 / 0.85), 0 0 18px 2px rgb(239 181 61 / 0.45); }
  .cursor { position: fixed; left: 0; top: 0; width: 92px; height: 92px; z-index: 6; pointer-events: none; transform: translate(-50%, -50%); filter: drop-shadow(0 12px 18px rgb(0 0 0 / 0.55)); }
  .hint { position: fixed; z-index: 6; margin: 0; color: var(--light-soft); pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/", "postprocessing": "/node_modules/postprocessing/build/index.js" } }</script>
</head>
<body class="dark">
<div class="glass" aria-hidden="true"></div>
<h1 class="name display">Bob Chung</h1>
<p class="insert" aria-hidden="true">INSERT COIN<i></i></p>
<p class="credits mono"><u>Credits 0 / 5</u><b></b><b></b><b></b><b></b><b></b></p>
<div class="slot" aria-hidden="true"></div>
<p class="hint mono">Drop it in</p>
<div class="chrome">
  <p class="tl">Bob Chung</p>
  <p class="tr"><span>Work</span><span>About</span><span>Contact</span><span>EN</span></p>
  <p class="bl">Software engineer. I build apps, games and websites.</p>
  <p class="br"><span>Scroll</span><i></i></p>
</div>
<script type="module">
import { THREE, coin, fonts, ready } from './kit.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

await fonts();
// Your cursor is a coin: the first of five.
const cv = document.createElement('canvas');
cv.width = cv.height = 256;
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.toneMapping = THREE.AgXToneMapping;
r.toneMappingExposure = 1.25;
const sc = new THREE.Scene();
sc.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const c = coin();
c.rotation.set(0.35, 0.5, 0.1);
sc.add(c, new THREE.DirectionalLight('#fff3e2', 2.2));
const cam = new THREE.PerspectiveCamera(26, 1, 0.1, 20);
cam.position.set(0, 0, 5);
r.render(sc, cam);
const img = document.createElement('img');
img.className = 'cursor';
img.alt = '';
document.body.append(img);
img.src = cv.toDataURL();
const hint = document.querySelector('.hint');
const slot = document.querySelector('.slot').getBoundingClientRect();
const pos = { x: slot.left + slot.width / 2 + 150, y: slot.top - 40 };
const place = () => {
  img.style.left = `${pos.x}px`; img.style.top = `${pos.y}px`;
  Object.assign(hint.style, { left: `${pos.x + 56}px`, top: `${pos.y - 8}px` });
};
place();
addEventListener('pointermove', (e) => { pos.x = e.clientX; pos.y = e.clientY; place(); });
img.decode().then(ready);
</script>
</body>
</html>
